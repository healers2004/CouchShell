# On every push and pull request: builds and tests the vendored Tachyon and couchd on Linux and
# Windows, and the UI on Windows.
name: CI

on: [push, pull_request]

jobs:
  cpp:
    strategy:
      fail-fast: false  # a Linux failure shouldn't cancel the Windows run, and vice versa
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Linux: GCC with AddressSanitizer (memory errors) and UndefinedBehaviorSanitizer.
      # -fno-sanitize-recover makes any report fail the test instead of just printing.
      - name: Configure (Linux, sanitizers)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"

      - name: Configure (Windows, MSVC)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      # --config / -C pick Debug on Windows, where one build folder holds Debug and Release.
      - name: Build
        run: cmake --build build --config Debug

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure

      # The real redis-cli against the vendored Tachyon, built as part of CouchShell. Tachyon's own
      # CI runs its slower crash, comparison and fuzz checks.
      - name: Smoke test with redis-cli (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y redis-tools
          bash vendor/tachyon/tools/smoke_test.sh build/vendor/tachyon/tachyon/tachyon

      # The real couchd and Tachyon together, over the same pub/sub protocol the UI uses.
      - name: Integration test (Windows)
        if: runner.os == 'Windows'
        run: tools/integration_test.ps1 build\vendor\tachyon\tachyon\Debug\tachyon.exe build\couchd\Debug\couchd.exe

  # Builds the WPF app and runs its unit tests. WPF only exists on Windows.
  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and test
        run: dotnet test ui/CouchShell.sln
