# Pushing a version tag like v1.0.0 tests the code, builds the installer and publishes it as a
# GitHub Release. The tag must match <Version> in ui/CouchShell/CouchShell.csproj.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed to create the release

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Check the tag matches the program's version
        run: |
          $version = ([xml](Get-Content ui/CouchShell/CouchShell.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME doesn't match version $version" }

      - name: Test
        run: dotnet test ui/CouchShell.sln

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        run: tools/build-installer.ps1

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = 'Download CouchShellSetup and run it. It installs for your user account, with no administrator rights and nothing else to install first. The installer is not code-signed, so Windows SmartScreen may warn about it: choose More info, then Run anyway.'
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem out\CouchShellSetup-*.exe).FullName --title "CouchShell $($env:GITHUB_REF_NAME)" --notes $notes
